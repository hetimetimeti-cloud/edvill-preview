name: Deploy EDVILL preview to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Prepare EDVILL reference images
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/references
          UA='Mozilla/5.0 EDVILL-GitHub-Pages'
          curl -A "$UA" -fsSL --retry 3 --retry-delay 2 'https://edvill.hu/wp-content/uploads/2024/09/IMG_20240808_200700-scaled.jpg' -o assets/references/terasz.jpg
          curl -A "$UA" -fsSL --retry 3 --retry-delay 2 'https://edvill.hu/wp-content/uploads/2024/09/11423756_994880383931379_774657023032516576_o-1-1024x614-1.jpg' -o assets/references/konyha.jpg
          curl -A "$UA" -fsSL --retry 3 --retry-delay 2 'https://edvill.hu/wp-content/uploads/2024/09/IMG_9521-1024x576-1.jpg' -o assets/references/rgb.jpg
          curl -A "$UA" -fsSL --retry 3 --retry-delay 2 'https://edvill.hu/wp-content/uploads/2024/07/448985721_1218784492872350_2689812110299741548_n-edited.jpg' -o assets/references/szorakozohely.jpg
          curl -A "$UA" -fsSL --retry 3 --retry-delay 2 'https://edvill.hu/wp-content/uploads/2024/08/20201213_160905-1-scaled.jpg' -o assets/references/kert.jpg
          curl -A "$UA" -fsSL --retry 3 --retry-delay 2 'https://edvill.hu/wp-content/uploads/2024/07/IMG_9529-1024x768.jpg' -o assets/references/mennyezeti-led.jpg
          curl -A "$UA" -fsSL --retry 3 --retry-delay 2 'https://edvill.hu/wp-content/uploads/2024/08/20201213_160915-1-1024x512.jpg' -o assets/references/haloszoba.jpg
          test -s assets/references/furdoszoba.jpg

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
